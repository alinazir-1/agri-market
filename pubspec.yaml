name: agri_market
description: Agriculture Marketplace — Buyer & Seller Portal
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State management & routing
  get: ^4.7.3

  # ── Firebase
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  firebase_storage: ^13.1.0
  firebase_messaging: ^16.1.2

  # ── Responsive
  responsive_framework: ^1.5.1
  flutter_screenutil: ^5.9.3

  # ── Fonts — NO download needed, auto from internet
  google_fonts: ^8.0.2

  # ── Media & Images
  image_picker: ^1.2.1
  image_picker_for_web: ^3.1.1
  cached_network_image: ^3.4.1

  # ── Networking
  dio: ^5.9.2
  connectivity_plus: ^7.0.0

  # ── Local storage
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.0.0

  # ── UI & Animations
  shimmer: ^3.0.0
  gap: ^3.0.1
  fl_chart: ^1.2.0
  table_calendar: ^3.2.0
  badges: ^3.1.2

  # ── Utilities
  intl: ^0.20.2
  uuid: ^4.5.3
  equatable: ^2.0.8
  json_annotation: ^4.11.0
  logger: ^2.7.0
  timeago: ^3.7.1

  # ── Web socket (live auction)
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.12
  json_serializable: ^6.8.0
  flutter_lints: ^4.0.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/logo/
    - assets/images/
    - assets/category images/
    - assets/banner images/
    - assets/social icon/
